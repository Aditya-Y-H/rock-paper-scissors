<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1 id="title">Rock Paper Scissors</h1>
    <div id="player-options-container">
      <button id="rock-button" class="player-option">Rock</button>
      <button id="paper-button" class="player-option">Paper</button>
      <button id="scissor-button" class="player-option">Scissors</button>
    </div>
    <div id="results-container">
      <div id="choices-made" class="result-text"></div>
      <div id="win-or-loose-declaration" class="result-text"></div>
      <div id="score-container">
        <div id="player-score" class="score">0</div>
        <div id="computer-score" class="score">0</div>
      </div>
    </div>

    <div id="best-of-five-victor" class="result-text"></div>
    <button id="reset-game-btn">Reset</button>
  </body>
</html>
