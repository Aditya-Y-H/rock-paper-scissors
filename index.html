<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="title-container">
      <h1 id="title">Rock Paper Scissors</h1>
    </div>
    <div id="game-display-container">
      <div id="human-container" class="character-container">
        <div class="character-name">human</div>
        <div id="human-choice" class="player-choice-display"></div>
        <div class="score-container">
          <span>Score</span>
          <span id="human-score" class="score">0</span>
        </div>
      </div>
      <div id="computer-container" class="character-container">
        <div class="character-name">computer</div>
        <div id="computer-choice" class="player-choice-display"></div>
        <div class="score-container">
          <span>Score</span>
          <span id="computer-score" class="score">0</span>
        </div>
      </div>
    </div>
    <div id="player-options-container">
      <button id="rock-button" class="player-option">Rock</button>
      <button id="paper-button" class="player-option">Paper</button>
      <button id="scissor-button" class="player-option">Scissors</button>
      <div id="reset-btn-container">
        <button id="reset-game-btn">Reset</button>
      </div>
    </div>
    <div id="results-container">
      <p id="result"></p>
    </div>
  </body>
</html>
